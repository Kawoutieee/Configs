name: Check and Score Xray Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    env:
      # Comma-separated ISO country codes to KEEP, e.g. "US,GB,DE".
      # Leave empty to keep all countries.
      COUNTRY_FILTER: ${{ vars.COUNTRY_FILTER || '' }}
      # Fraud-score filter. Options: all | lt50 | lte33 | zero
      #   all   = keep every config regardless of score
      #   lt50  = keep score < 50
      #   lte33 = keep score <= 33   (default — "33 and less")
      #   zero  = keep only score == 0
      SCORE_FILTER: ${{ vars.SCORE_FILTER || 'lte33' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install xray-knife
        run: |
          go install -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc" \
            github.com/lilendian0x00/xray-knife/v11@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          xray-knife --version

      - name: Parse subscriptions
        run: |
          bash scripts/parse_subscriptions.sh
          wc -l output/configs.txt

      - name: Test configs with xray-knife
        run: |
          set +e
          xray-knife http \
            -f output/configs.txt \
            --type csv \
            -o output/results.csv
          set -e
          if [ ! -f output/results.csv ]; then
            echo "::warning::xray-knife produced no results.csv"
            echo "" > output/results.csv
          fi
          
      - name: Extract working IPs
        run: |
          python3 <<'PYEOF'
          import csv, json, sys

          def find_col(fields, candidates):
              if not fields: return None
              lower = {f.lower(): f for f in fields}
              for c in candidates:
                  if c.lower() in lower: return lower[c.lower()]
              return None

          ips, working, skipped = set(), [], 0

          with open('output/results.csv', 'r', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              ip_col     = find_col(reader.fieldnames, ['ip', 'real_ip', 'exit_ip', 'ip_address'])
              link_col   = find_col(reader.fieldnames, ['link', 'config', 'url', 'remark', 'name'])
              status_col = find_col(reader.fieldnames, ['status'])
              succ_col   = find_col(reader.fieldnames, ['success'])

              for row in reader:
                  passed = False
                  if status_col and (row.get(status_col) or '').strip().lower() == 'passed':
                      passed = True
                  elif succ_col and str(row.get(succ_col, '')).strip() == '1':
                      passed = True
                  if not passed:
                      skipped += 1
                      continue
                  ip   = (row.get(ip_col) or '').strip() if ip_col else ''
                  link = (row.get(link_col) or '').strip() if link_col else ''
                  if ip and link:
                      ips.add(ip)
                      working.append({'link': link, 'ip': ip})

          with open('output/ips.txt', 'w') as f:
              for ip in sorted(ips): f.write(ip + '\n')
          with open('output/working.json', 'w') as f:
              json.dump(working, f, indent=2)

          print(f"Extracted {len(ips)} unique IPs, {len(working)} working configs ({skipped} skipped).")
          PYEOF

      - name: Country lookup (ip-api.com)
        run: |
          if [ ! -s output/ips.txt ]; then
            echo "::warning::No IPs to look up."
            echo "{}" > output/countries.json
            exit 0
          fi
          python3 <<'PYEOF'
          import json, time, urllib.request
          with open('output/ips.txt') as f:
              ips = [line.strip() for line in f if line.strip()]
          countries = {}
          for i in range(0, len(ips), 100):
              batch = ips[i:i+100]
              req = urllib.request.Request(
                  'http://ip-api.com/batch?fields=countryCode,query',
                  data=json.dumps([{'query': ip} for ip in batch]).encode(),
                  headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      for entry in json.loads(resp.read().decode()):
                          if entry.get('countryCode'):
                              countries[entry['query']] = entry['countryCode']
              except Exception as e:
                  print(f'Batch lookup failed: {e}')
              time.sleep(4)
          with open('output/countries.json', 'w') as f:
              json.dump(countries, f)
          print(f'Resolved {len(countries)} country codes.')
          PYEOF

      - name: Country filter
        run: |
          python3 <<'PYEOF'
          import json, os, sys

          whitelist = [c.strip().upper() for c in os.environ.get('COUNTRY_FILTER', '').split(',') if c.strip()]
          if not whitelist:
              print("No COUNTRY_FILTER set — keeping all countries.")
              sys.exit(0)

          print(f"Country whitelist: {whitelist}")

          with open('output/countries.json') as f:
              countries = json.load(f)
          with open('output/working.json') as f:
              working = json.load(f)

          kept = [e for e in working if countries.get(e['ip'], '').upper() in whitelist]
          dropped = len(working) - len(kept)

          with open('output/working.json', 'w') as f:
              json.dump(kept, f, indent=2)
          with open('output/ips.txt', 'w') as f:
              for ip in sorted({e['ip'] for e in kept}):
                  f.write(ip + '\n')

          print(f"Kept {len(kept)} configs, dropped {dropped} by country filter.")
          PYEOF

      - name: Query Fraudlogix for IP risk scores
        env:
          FRAUDLOGIX_API_KEY: ${{ secrets.FRAUDLOGIX_API_KEY }}
        run: |
          echo "ip,risk,datacenter,connection_type,proxy,vpn" > output/fraudlogix_scores.csv

          if [ ! -s output/ips.txt ]; then
            echo "::warning::No IPs to check."
            exit 0
          fi

          while IFS= read -r ip; do
            [ -z "$ip" ] && continue

            response=$(curl -s -H "x-api-key: ${FRAUDLOGIX_API_KEY}" \
              "https://iplist.fraudlogix.com/v5?ip=${ip}")

            risk=$(echo "$response" | jq -r '.RiskScore // "NA"')
            dc=$(echo "$response" | jq -r '.DataCenter // false')
            ctype=$(echo "$response" | jq -r '.ConnectionType // "NA"')
            proxy=$(echo "$response" | jq -r '.Proxy // false')
            vpn=$(echo "$response" | jq -r '.VPN // false')

            echo "${ip},${risk},${dc},${ctype},${proxy},${vpn}" >> output/fraudlogix_scores.csv
            sleep 1
          done < output/ips.txt

          echo "Fraudlogix query complete."

      - name: Filter by Fraudlogix risk level
        env:
          RISK_FILTER: ${{ vars.RISK_FILTER || 'low_med' }}
        run: |
          python3 <<'PYEOF'
          import csv, json, os, sys

          mode = os.environ.get('RISK_FILTER', 'low_med').strip().lower()
          allowed = {
              'low_med': {'low', 'medium'},
              'low':     {'low'},
              'all':     {'low', 'medium', 'high', 'extreme', 'na'},
          }.get(mode, {'low', 'medium'})

          print(f"Risk filter mode: {mode} -> allowed: {sorted(allowed)}")

          scores = {}
          with open('output/fraudlogix_scores.csv') as f:
              for row in csv.DictReader(f):
                  if row.get('ip'):
                      scores[row['ip']] = row

          with open('output/working.json') as f:
              working = json.load(f)

          kept = []
          for e in working:
              s = scores.get(e['ip'], {})
              if (s.get('risk', 'NA') or 'NA').lower() in allowed:
                  kept.append(e)

          dropped = len(working) - len(kept)
          with open('output/working.json', 'w') as f:
              json.dump(kept, f, indent=2)

          print(f"Kept {len(kept)} configs, dropped {dropped} by risk filter.")
          PYEOF
          
      - name: Merge results and rename configs
        run: python3 scripts/process.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-configs
          path: |
            output/final.txt
            output/final_base64.txt
          retention-days: 7

      - name: Commit output back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/final.txt output/final_base64.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update final configs [skip ci]"
          git push
