name: Check and Score Xray Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

jobs:
  check-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install xray-knife
        run: |
          go install -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc" \
            github.com/lilendian0x00/xray-knife/v11@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          xray-knife --version

      - name: Parse subscriptions
        run: |
          bash scripts/parse_subscriptions.sh
          echo "Parsed configs:"
          wc -l output/configs.txt

      - name: Test configs with xray-knife
        run: |
          set +e
          xray-knife http -f output/configs.txt --type csv -o output/results.csv
          set -e
          if [ ! -f output/results.csv ]; then
            echo "::warning::xray-knife produced no results.csv — all configs may have failed."
            echo "" > output/results.csv
          fi

      - name: Extract working IPs
        run: |
          python3 <<'PYEOF'
          import csv, json, sys

          def find_col(fields, candidates):
              if not fields:
                  return None
              lower = {f.lower(): f for f in fields}
              for c in candidates:
                  if c.lower() in lower:
                      return lower[c.lower()]
              return None

          ips = set()
          working = []
          skipped = 0

          try:
              with open('output/results.csv', 'r', encoding='utf-8-sig') as f:
                  reader = csv.DictReader(f)
                  print(f"Headers: {reader.fieldnames}")

                  ip_col     = find_col(reader.fieldnames, ['ip', 'real_ip', 'exit_ip', 'ip_address'])
                  link_col   = find_col(reader.fieldnames, ['link', 'config', 'url', 'remark', 'name'])
                  status_col = find_col(reader.fieldnames, ['status'])
                  succ_col   = find_col(reader.fieldnames, ['success'])

                  print(f"Detected: ip={ip_col!r}, link={link_col!r}, status={status_col!r}, success={succ_col!r}")

                  for row in reader:
                      # Require an explicit "passed" status, or success == 1 as fallback
                      passed = False
                      if status_col and (row.get(status_col) or '').strip().lower() == 'passed':
                          passed = True
                      elif succ_col and str(row.get(succ_col, '')).strip() == '1':
                          passed = True
                      if not passed:
                          skipped += 1
                          continue

                      ip   = (row.get(ip_col) or '').strip() if ip_col else ''
                      link = (row.get(link_col) or '').strip() if link_col else ''
                      if ip and link:
                          ips.add(ip)
                          working.append({'link': link, 'ip': ip})

          except Exception as e:
              print(f"ERROR: {e}", file=sys.stderr)
              import traceback; traceback.print_exc()

          with open('output/ips.txt', 'w') as f:
              for ip in sorted(ips):
                  f.write(ip + '\n')

          with open('output/working.json', 'w') as f:
              json.dump(working, f, indent=2)

          print(f"\nExtracted {len(ips)} unique IPs, {len(working)} working configs ({skipped} skipped as failed).")
          PYEOF
          
      - name: Country lookup (ip-api.com)
        run: |
          if [ ! -s output/ips.txt ]; then
            echo "::warning::No IPs to look up."
            echo "{}" > output/countries.json
            exit 0
          fi

          python3 <<'PYEOF'
          import json, time, urllib.request

          with open('output/ips.txt') as f:
              ips = [line.strip() for line in f if line.strip()]

          countries = {}
          batch_size = 100
          for i in range(0, len(ips), batch_size):
              batch = ips[i:i+batch_size]
              req = urllib.request.Request(
                  'http://ip-api.com/batch?fields=countryCode,query',
                  data=json.dumps([{'query': ip} for ip in batch]).encode(),
                  headers={'Content-Type': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      for entry in data:
                          if entry.get('countryCode'):
                              countries[entry['query']] = entry['countryCode']
              except Exception as e:
                  print(f'Batch lookup failed: {e}')
              time.sleep(4)

          with open('output/countries.json', 'w') as f:
              json.dump(countries, f)
          print(f'Resolved {len(countries)} country codes.')
          PYEOF

      - name: Query proxycheck.io v3 for fraud scores
        env:
          PROXYCHECK_API_KEY: ${{ secrets.PROXYCHECK_API_KEY }}
        run: |
          echo "ip,score,risk" > output/fraud.csv

          if [ ! -s output/ips.txt ]; then
            echo "::warning::No IPs to check."
            exit 0
          fi

          while IFS= read -r ip; do
            [ -z "$ip" ] && continue

            if [ -n "$PROXYCHECK_API_KEY" ]; then
              url="https://proxycheck.io/v3/${ip}?key=${PROXYCHECK_API_KEY}"
            else
              url="https://proxycheck.io/v3/${ip}"
            fi

            response=$(curl -s "$url")
            score=$(echo "$response" | jq -r --arg ip "$ip" '.[$ip].detections.risk // "NA"')

            if [ "$score" = "NA" ]; then
              risk_label="NA"
            elif [ "$score" -le 33 ]; then
              risk_label="low"
            elif [ "$score" -le 66 ]; then
              risk_label="medium"
            else
              risk_label="high"
            fi

            echo "${ip},${score},${risk_label}" >> output/fraud.csv
            sleep 1
          done < output/ips.txt

          echo "Fraud score query complete."

      - name: Merge results and rename configs
        run: |
          python3 scripts/process.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-configs
          path: |
            output/final.txt
            output/final_base64.txt
          retention-days: 7

      - name: Commit output back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/final.txt output/final_base64.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update final configs [skip ci]"
          git push
